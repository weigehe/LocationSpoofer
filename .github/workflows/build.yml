name: Build LocationSpoofer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Replace Gradle repository with Tsinghua mirror
        run: |
          sed -i 's|https\:\/\/repo.maven.apache.org/maven2|https\:\/\/mirrors.tuna.tsinghua.edu.cn/maven|g' build.gradle
          sed -i 's|https\:\/\/dl.google.com/dl/android/maven2|https\:\/\/mirrors.tuna.tsinghua.edu.cn/android/repository|g' build.gradle
          sed -i 's|https\:\/\/services.gradle.org\/distributions|https\:\/\/mirrors.tuna.tsinghua.edu.cn/gradle|g' gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
